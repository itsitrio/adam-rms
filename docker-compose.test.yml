# Local test stack for the unserialized-assets branch.
# Save as docker-compose.test.yml in the repo root, then:  docker compose -f docker-compose.test.yml up --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy   # migrate.sh has no retry, so MySQL must be up before it runs
    volumes:
      # Lets you edit PHP/Twig on the host and just refresh the browser - no rebuild.
      # The migration is baked into the image, so re-run `up --build` if you change db/migrations.
      - ./src:/var/www/html/src
    environment:
      - DB_HOSTNAME=db
      - DB_DATABASE=adamrms
      - DB_USERNAME=adamrms
      - DB_PASSWORD=adamrms
      - DB_PORT=3306
      - DEV_MODE=true
      - CONFIG_ROOTURL=http://localhost:8080

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=adamrms
      - MYSQL_USER=adamrms
      - MYSQL_PASSWORD=adamrms
      - MYSQL_ROOT_PASSWORD=adamrms
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uadamrms", "-padamrms"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5-apache
    ports:
      - "8082:80"
    depends_on:
      - db
    environment:
      - PMA_HOST=db
      - PMA_USER=adamrms
      - PMA_PASSWORD=adamrms

volumes:
  db_data:
